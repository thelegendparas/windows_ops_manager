[project]
name = "windows-ops-agent"
version = "0.1.0"
description = "AI operations assistant for a Windows production host (PydanticAI + OpenRouter/GLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai]>=0.4,<1",
    "pydantic-settings>=2.2",
    "psutil>=5.9",
    # pydantic-ai 0.8 imports opentelemetry._events, which opentelemetry-api
    # 1.44.0 removed; cap until pydantic-ai catches up.
    "opentelemetry-api>=1.28,<1.44",
]

[project.scripts]
windows-agent = "agent.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]